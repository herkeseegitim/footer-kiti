<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tebeşir tahtası önizleme</title>
<style>
html,body{margin:0}
body{background:#FFFFFF;color:#2A2A2A;font:400 17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Helvetica Neue",Arial,sans-serif;display:flex;flex-direction:column;min-height:100vh}
.ornek-ana{flex:1;max-width:1120px;width:100%;margin:0 auto;padding:40px 24px 64px;box-sizing:border-box}
.ornek-ana p{margin:0 0 16px;color:#5A5A5A}
.ornek-kutu{height:14px;border-radius:7px;background:#ECECEC;margin:0 0 12px}
</style>
</head>
<body>
<main class="ornek-ana">
<p>Sayfanızın içeriği burada.</p>
<div class="ornek-kutu" style="width:72%"></div>
<div class="ornek-kutu" style="width:88%"></div>
<div class="ornek-kutu" style="width:54%"></div>
</main>
<!-- Herkese Eğitim footer kiti v1: Tebeşir tahtası. MIT lisansı, herkeseegitim.com
     Değiştirin: köşeli parantez içindeki her şey ([Sitenizin adı], [Yıl], adresler). Köşeli parantezleri de silin. Başka bir alt bilginiz varsa onu kaldırın: sayfada tek footer olsun. Stil bloğu ve footer birlikte kopyalanır. -->
<style>.hek-tahta,.hek-tahta *,.hek-tahta *::before,.hek-tahta *::after{box-sizing:border-box}.hek-tahta{padding:0;text-indent:0}.hek-tahta p,.hek-tahta ul,.hek-tahta li,.hek-tahta nav{margin:0;padding:0;text-indent:0;border:0;background:none;box-shadow:none}.hek-tahta ul{list-style:none}.hek-tahta p,.hek-tahta li,.hek-tahta nav,.hek-tahta a,.hek-tahta span,.hek-tahta b,.hek-tahta small,.hek-tahta i{font-family:inherit;font-style:inherit;letter-spacing:inherit;text-transform:none}.hek-tahta b,.hek-tahta small,.hek-tahta span{color:inherit;font-size:inherit;font-weight:inherit;line-height:inherit}.hek-tahta a{background:none;border:0;border-radius:0;box-shadow:none;padding:0;margin:0;font-weight:inherit;text-decoration:none;text-indent:0;transition:none;min-width:44px;color:inherit}.hek-tahta a:hover,.hek-tahta a:focus{background:none;border:0;box-shadow:none}.hek-tahta svg{display:block;max-width:none}
.hek-tahta{--hek-tahta-zemin:#21302A;--hek-tahta-tebesir:#F4EFE3;--hek-tahta-soluk:#CFC7B3;--hek-tahta-odak:#FFC21A;container:hek-tahta/inline-size;position:relative;margin:0;background-color:var(--hek-tahta-zemin);background-image:radial-gradient(ellipse at 18% 22%,rgba(255,255,255,.05),transparent 55%),radial-gradient(ellipse at 82% 70%,rgba(255,255,255,.04),transparent 50%);color:var(--hek-tahta-tebesir);font:400 17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Helvetica Neue",Arial,sans-serif;border-top:14px solid #8A5A2B;box-shadow:inset 0 14px 0 rgba(0,0,0,.22);color-scheme:dark;overflow-wrap:anywhere;text-align:left}
.hek-tahta-ic{max-width:1120px;margin:0 auto;padding:40px 24px 28px}
.hek-tahta-ust{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:28px 40px}
.hek-tahta-zil{width:40px;height:40px;fill:var(--hek-tahta-odak);transform-origin:50% 6%;margin-bottom:4px}
.hek-tahta-veda:hover .hek-tahta-zil{animation:hek-tahta-salla .45s ease-in-out 3}
@keyframes hek-tahta-salla{0%,100%{transform:rotate(0)}25%{transform:rotate(16deg)}75%{transform:rotate(-16deg)}}
.hek-tahta .hek-tahta-baslik{font-size:clamp(36px,7cqi,72px);line-height:.95;font-weight:800;letter-spacing:-.03em;color:#F7F2E6;transform:rotate(-2deg);transform-origin:left;text-shadow:0 0 1px rgba(255,255,255,.5),2px 2px 0 rgba(255,255,255,.06)}
.hek-tahta .hek-tahta-not{font-size:18px;color:var(--hek-tahta-soluk);margin-top:14px}
.hek-tahta .hek-tahta-mik{display:flex;flex-wrap:wrap;gap:16px 18px}
.hek-tahta .hek-tahta-m{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:64px;min-height:44px;padding:2px;color:var(--hek-tahta-tebesir);text-decoration:none;border-radius:12px}
.hek-tahta .hek-tahta-m b{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:18px;font-weight:800;line-height:1;box-shadow:0 6px 0 rgba(0,0,0,.4),inset 0 -5px 0 rgba(0,0,0,.18),inset 0 4px 0 rgba(255,255,255,.25);transition:transform .2s}
.hek-tahta .hek-tahta-m span{font-size:14px;color:var(--hek-tahta-soluk)}
.hek-tahta .hek-tahta-mik li:nth-child(odd) b{transform:rotate(-6deg)}.hek-tahta .hek-tahta-mik li:nth-child(even) b{transform:rotate(5deg)}
.hek-tahta .hek-tahta-mik .hek-tahta-m:hover b,.hek-tahta .hek-tahta-mik .hek-tahta-m:focus-visible b{transform:translateY(-4px) rotate(0)}
.hek-tahta .hek-tahta-m1 b{background:#C62E26;color:#fff}.hek-tahta .hek-tahta-m2 b{background:#FFC21A;color:#2A1C10}.hek-tahta .hek-tahta-m3 b{background:#F7F0E1;color:#2A1C10}.hek-tahta .hek-tahta-m4 b{background:#7FCBB9;color:#14241E}
.hek-tahta-alt{display:flex;flex-wrap:wrap;align-items:center;gap:8px 32px;margin-top:32px;padding-top:18px;border-top:2px dashed rgba(244,239,227,.22)}
.hek-tahta .hek-tahta-ad{font-weight:750;font-size:19px}
.hek-tahta-alt ul{display:flex;flex-wrap:wrap;gap:0 22px}
.hek-tahta .hek-tahta-alt a{display:inline-flex;align-items:center;min-height:44px;color:var(--hek-tahta-soluk);text-decoration:underline;text-decoration-color:rgba(207,199,179,.45);text-underline-offset:4px}
.hek-tahta .hek-tahta-alt a:hover{color:var(--hek-tahta-odak);text-decoration-color:currentColor}
.hek-tahta a:focus-visible{outline:3px solid var(--hek-tahta-odak);outline-offset:3px}
.hek-tahta .hek-tahta-kucuk{font-size:14px;color:var(--hek-tahta-soluk);margin-top:10px}
.hek-tahta-raf{height:16px;background:#8A5A2B;box-shadow:inset 0 3px 0 rgba(255,255,255,.12),inset 0 -4px 0 rgba(0,0,0,.25);position:relative}
.hek-tahta-raf i{position:absolute;top:-7px;height:9px;border-radius:3px;background:#F7F2E6}
.hek-tahta-raf i:nth-child(1){left:12%;width:44px}.hek-tahta-raf i:nth-child(2){left:calc(12% + 54px);width:26px;background:#FFC21A}.hek-tahta-raf i:nth-child(3){right:14%;width:34px;background:#F2A0B0}
@container hek-tahta (max-width:560px){.hek-tahta-ic{padding:30px 16px 22px}.hek-tahta-mik{gap:12px 10px}.hek-tahta .hek-tahta-m{min-width:58px}.hek-tahta .hek-tahta-m b{width:50px;height:50px;font-size:16px}.hek-tahta-alt ul{gap:0 16px}}
@media (prefers-reduced-motion:reduce){.hek-tahta.hek-tahta.hek-tahta.hek-tahta *{animation:none;transition:none}}
@media (forced-colors:active){.hek-tahta .hek-tahta-m b{border:2px solid CanvasText}}
</style>
<footer class="hek-tahta" role="contentinfo" lang="tr">
  <div class="hek-tahta-ic">
    <div class="hek-tahta-ust">
      <div class="hek-tahta-veda">
        <svg class="hek-tahta-zil" viewBox="0 0 64 64" aria-hidden="true" focusable="false"><path d="M32 6c-11 0-18 8-18 20v12l-6 8h48l-6-8V26C50 14 43 6 32 6z"/><circle cx="32" cy="52" r="5"/><rect x="29" y="1" width="6" height="7" rx="2"/></svg>
        <p class="hek-tahta-baslik">Zil çaldı</p>
        <p class="hek-tahta-not">Yarın yine buradayız.</p>
      </div>
      <ul class="hek-tahta-mik" aria-label="Sosyal medya">
      <li><a class="hek-tahta-m hek-tahta-m1" href="[YouTube adresiniz]"><b aria-hidden="true">YT</b><span>YouTube</span></a></li>
      <li><a class="hek-tahta-m hek-tahta-m2" href="[Instagram adresiniz]"><b aria-hidden="true">IG</b><span>Instagram</span></a></li>
      <li><a class="hek-tahta-m hek-tahta-m3" href="[Blog adresiniz]"><b aria-hidden="true">B</b><span>Blog</span></a></li>
      <li><a class="hek-tahta-m hek-tahta-m4" href="mailto:[e-posta adresiniz]"><b aria-hidden="true">@</b><span>E-posta</span></a></li>
      </ul>
    </div>
    <div class="hek-tahta-alt">
      <p class="hek-tahta-ad">[Sitenizin adı]</p>
      <nav aria-label="Alt bilgi bağlantıları">
        <ul>
          <li><a href="[Hakkında sayfanızın adresi]">Hakkında</a></li>
          <li><a href="mailto:[e-posta adresiniz]">İletişim</a></li>
          <li><a href="[Gizlilik sayfanızın adresi]">Gizlilik</a></li>
        </ul>
      </nav>
    </div>
    <p class="hek-tahta-kucuk">© [Yıl] [Sitenizin adı]</p>
  </div>
  <div class="hek-tahta-raf" aria-hidden="true"><i></i><i></i><i></i></div>
</footer>
</body>
</html>
