<style>.hek-muhur,.hek-muhur *,.hek-muhur *::before,.hek-muhur *::after{box-sizing:border-box}.hek-muhur{padding:0;text-indent:0}.hek-muhur p,.hek-muhur ul,.hek-muhur li,.hek-muhur nav{margin:0;padding:0;text-indent:0;border:0;background:none;box-shadow:none}.hek-muhur ul{list-style:none}.hek-muhur p,.hek-muhur li,.hek-muhur nav,.hek-muhur a,.hek-muhur span,.hek-muhur b,.hek-muhur small,.hek-muhur i{font-family:inherit;font-style:inherit;letter-spacing:inherit;text-transform:none}.hek-muhur b,.hek-muhur small,.hek-muhur span{color:inherit;font-size:inherit;font-weight:inherit;line-height:inherit}.hek-muhur a{background:none;border:0;border-radius:0;box-shadow:none;padding:0;margin:0;font-weight:inherit;text-decoration:none;text-indent:0;transition:none;min-width:44px;color:inherit}.hek-muhur a:hover,.hek-muhur a:focus{background:none;border:0;box-shadow:none}.hek-muhur svg{display:block;max-width:none}
.hek-muhur{--hek-muhur-kagit:#F6EEDC;--hek-muhur-yazi:#2A1C10;--hek-muhur-soluk:#5A4632;--hek-muhur-murekkep:#A3211A;container:hek-muhur/inline-size;position:relative;margin:18px 0 0;background-color:var(--hek-muhur-kagit);background-image:radial-gradient(ellipse at 70% 30%,rgba(255,255,255,.45),transparent 60%);color:var(--hek-muhur-yazi);font:400 17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Helvetica Neue",Arial,sans-serif;color-scheme:light;overflow-wrap:anywhere;text-align:left}
.hek-muhur::before{content:"";position:absolute;left:0;right:0;top:-10px;height:10px;background:radial-gradient(circle at 10px 10px,var(--hek-muhur-kagit) 0 9.5px,transparent 10px) 0 0/20px 20px repeat-x}

.hek-muhur-damga{width:172px;height:172px;flex:none;border-radius:50%;border:4px solid var(--hek-muhur-murekkep);box-shadow:0 0 0 5px var(--hek-muhur-kagit),0 0 0 7px var(--hek-muhur-murekkep);color:var(--hek-muhur-murekkep);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:18px 12px;transform:rotate(-9deg);margin:10px;overflow:hidden}

.hek-muhur .hek-muhur-pullar{display:flex;flex-wrap:wrap;gap:14px;margin-top:20px}
.hek-muhur a.hek-muhur-pul{display:block;min-width:84px;padding:6px 6px 4px;background:#FFFDF7;border:4px dotted var(--hek-muhur-kagit);outline:1px solid #E2D5BC;outline-offset:-4px;color:var(--hek-muhur-yazi);text-decoration:none;text-align:center;transform:rotate(var(--hek-muhur-a,0deg));transition:transform .2s;box-shadow:0 3px 0 rgba(42,28,16,.12)}
.hek-muhur .hek-muhur-pul b{display:grid;place-items:center;height:48px;font-size:20px;font-weight:850;color:#fff}
.hek-muhur .hek-muhur-pul span{display:block;font-size:13px;line-height:1.3;padding:4px 2px 0;overflow-wrap:normal;white-space:nowrap}
.hek-muhur .hek-muhur-pullar li:nth-child(1) a{--hek-muhur-a:-3deg}.hek-muhur-pullar li:nth-child(2) a{--hek-muhur-a:2deg}.hek-muhur-pullar li:nth-child(3) a{--hek-muhur-a:-1deg}.hek-muhur-pullar li:nth-child(4) a{--hek-muhur-a:3deg}
.hek-muhur .hek-muhur-p1 b{background:#A3211A}.hek-muhur .hek-muhur-p2 b{background:#2F5D8A}.hek-muhur .hek-muhur-p3 b{background:#2E6E5E}.hek-muhur .hek-muhur-p4 b{background:#7A4F00}
.hek-muhur a.hek-muhur-pul:hover,.hek-muhur a.hek-muhur-pul:focus-visible{background:#FFFDF7;border:4px dotted var(--hek-muhur-kagit);transform:rotate(0) translateY(-3px)}
.hek-muhur-alt{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 28px;border-top:1px solid #D9C9A8;padding-top:10px}
.hek-muhur-alt ul{display:flex;flex-wrap:wrap;gap:0 22px}
.hek-muhur .hek-muhur-alt a{display:inline-flex;align-items:center;min-height:44px;color:var(--hek-muhur-yazi);text-decoration:underline;text-decoration-color:rgba(163,33,26,.5);text-underline-offset:4px}
.hek-muhur .hek-muhur-alt a:hover{color:var(--hek-muhur-murekkep)}
.hek-muhur a:focus-visible{outline:3px solid #1F6FEB;outline-offset:3px}
.hek-muhur .hek-muhur-kucuk{font-size:15px;color:var(--hek-muhur-soluk)}
@container hek-muhur (max-width:600px){.hek-muhur-ic{grid-template-columns:1fr;padding:32px 16px 22px;gap:18px}.hek-muhur-damga{width:150px;height:150px;margin:6px 8px;padding:14px 10px}.hek-muhur .hek-muhur-damga b{font-size:12px;max-width:118px}.hek-muhur .hek-muhur-damga small{font-size:11px}.hek-muhur-pullar{gap:10px}.hek-muhur a.hek-muhur-pul{min-width:76px}}
@container hek-muhur (max-width:220px){.hek-muhur-damga{display:none}}
@media (prefers-reduced-motion:reduce){.hek-muhur.hek-muhur.hek-muhur.hek-muhur *{animation:none;transition:none}}

</style>
